# Compilation d'Onde sur les machines de GitHub : Windows (installateur) et macOS (image disque).
# Lancement : onglet « Actions » › « Compiler Onde » › « Run workflow », ou automatiquement en poussant une étiquette
# de version (git tag v0.6 && git push --tags) : une version GitHub est alors publiée avec les fichiers, ce que
# lit la vérification des mises à jour d'Onde (Aide › Rechercher des mises à jour).
name: Compiler Onde

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

env:
  TRACKTION_COMMIT: a5e44996f5f08dfa6af5f5d02d900fb3cfa37422

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances (Tracktion Engine + JUCE)
        shell: bash
        run: |
          git clone https://github.com/Tracktion/tracktion_engine.git deps/tracktion_engine
          git -C deps/tracktion_engine checkout $TRACKTION_COMMIT
          git -C deps/tracktion_engine submodule update --init --recursive --depth 1
      - name: Configuration
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Compilation
        run: cmake --build build-windows --config Release --parallel --target Onde onde-runtime onde-setup
      - name: Installateur (sans les modèles du séparateur, téléchargeables à part)
        shell: pwsh
        run: ./windows/creer-installateur.ps1 -SansModeles
      - uses: actions/upload-artifact@v7
        with:
          name: Onde-Windows
          path: build-windows/installateur/Onde-*

  macos:
    runs-on: macos-latest
    # Un échec ici ne bloque pas la version Windows.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances (Tracktion Engine + JUCE)
        run: |
          git clone https://github.com/Tracktion/tracktion_engine.git deps/tracktion_engine
          git -C deps/tracktion_engine checkout $TRACKTION_COMMIT
          git -C deps/tracktion_engine submodule update --init --recursive --depth 1
      - name: Configuration
        run: cmake -S . -B build-macos -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compilation
        run: cmake --build build-macos --parallel 4 --target onde-runtime
      - name: Essai sur Mac (rendu avec un plugin isolé qui plante)
        continue-on-error: true
        run: |
          APP=$(find build-macos -name "Onde.app" -maxdepth 6 -type d | head -1)
          mkdir -p essai
          perl -e 'alarm 300; exec @ARGV' "$APP/Contents/MacOS/Onde" --render-test "$PWD/essai"
      - name: Image disque (.dmg)
        run: |
          APP=$(find build-macos -name "Onde.app" -maxdepth 6 -type d | head -1)
          VERSION=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' app/Source/AboutPanel.h | head -1)
          rm -rf "$APP/Contents/MacOS/plugins-de-test"
          test -x "$APP/Contents/MacOS/onde-plugin-host"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Onde" -srcfolder dmg -ov -format UDZO "Onde-$VERSION-macOS.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: Onde-macOS
          path: Onde-*-macOS.dmg

  publier:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: fichiers
      - name: Version GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: fichiers/**/*
          generate_release_notes: true
