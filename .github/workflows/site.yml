# Page de téléchargement d'Onde (dossier site/) publiée sur GitHub Pages à chaque modification.
# Réglage du dépôt : Settings › Pages › Source : « GitHub Actions ».
name: Page de téléchargement

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'site/**', '.github/workflows/site.yml' ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publier:
    needs: preparer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
