# Page de téléchargement d'Onde (dossier site/) publiée sur GitHub Pages à chaque modification.
# À activer une fois : Settings › Pages › Source : « GitHub Actions ».
name: Page de téléchargement

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'site/**', '.github/workflows/site.yml' ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
